name: Update Data (HSR)

on:
    workflow_dispatch: {}
    schedule:
        - cron: '0 12 * * *'

jobs:
    update:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Swift
              uses: SwiftyLab/setup-swift@latest

            - name: Update Data (Attempt 1/2)
              id: compare_shas
              continue-on-error: true
              run: |
                swift ./UpdateData4HSR.swift

            - name: Reset and retry (Attempt 2/2)
              if: steps.compare_shas.outcome == 'failure'
              run: |
                echo "::warning::Attempt 1 failed (script crash or network error). Resetting the worktree and retrying."
                git checkout -- .
                swift ./UpdateData4HSR.swift

            - name: Create Pull Request
              uses: peter-evans/create-pull-request@v3
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                branch: update-data-${{ github.run_number }}
                base: main
                title: "Update Data (HSR)"
                body: |
                  This PR updates all external data which are CI-updatable.
                delete-branch: true
                assignees: ShikiSuen
                reviewers: ShikiSuen
                team-reviewers: |
                  owners
                  maintainers
